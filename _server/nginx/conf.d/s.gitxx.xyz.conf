# Live Admin — s.gitxx.xyz（HTTP only；HTTPS 由 certbot 在宿主机 nginx 上配置）
# 安装：见 deploy/README.md（勿在本仓库内执行 systemctl / certbot）

upstream live_admin_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream live_admin_web {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    server_name s.gitxx.xyz;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/event-stream;

    # 对应 Caddy handle_path /api/*：剥离 /api 前缀后转发到 FastAPI
    location /api/ {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://live_admin_api/;
    }

    # 对应 Caddy handle /events* + flush_interval -1
    location /events {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_pass http://live_admin_api;
    }

    # 其余请求 → 前端静态站（Vite 构建产物）
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://live_admin_web;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/s.gitxx.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/s.gitxx.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = s.gitxx.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name s.gitxx.xyz;
    return 404; # managed by Certbot


}