services:
  xedc_member.submission_theme_negotiator:
    class: Drupal\xedc_member\Theme\MemberSubmissionThemeNegotiator
    arguments:
      - '@config.factory'
    tags:
      - { name: theme_negotiator, priority: 100 }

  xedc_member.lazy_builders:
    class: Drupal\xedc_member\MemberLazyBuilders
    arguments:
      - '@current_user'
      - '@form_builder'

  xedc_member.favorite_manager:
    class: Drupal\xedc_member\Service\FavoriteManager
    arguments:
      - '@database'
      - '@datetime.time'

  xedc_member.history_manager:
    class: Drupal\xedc_member\Service\HistoryManager
    arguments:
      - '@database'
      - '@datetime.time'
      - '@user.data'

  xedc_member.history_subscriber:
    class: Drupal\xedc_member\EventSubscriber\HistorySubscriber
    arguments:
      - '@xedc_member.history_manager'
      - '@current_route_match'
      - '@current_user'
    tags:
      - { name: event_subscriber }

  xedc_member.alias_manager:
    class: Drupal\xedc_member\Service\MemberAliasManager
    arguments:
      - '@database'
      - '@user.data'
      - '@language_manager'
      - '@entity_type.manager'
      - '@path_alias.repository'
      - '@cache.default'

  xedc_member.alias_path_processor:
    class: Drupal\xedc_member\PathProcessor\MemberAliasPathProcessor
    arguments:
      - '@xedc_member.alias_manager'
      - '@current_user'
    tags:
      - { name: path_processor_inbound, priority: 150 }
      - { name: path_processor_outbound, priority: 50 }

  xedc_member.center_access:
    class: Drupal\xedc_member\Access\MemberCenterAccessCheck
    arguments:
      - '@xedc_member.alias_manager'
    tags:
      - { name: access_check, applies_to: _xedc_member_center }

  xedc_member.public_profile:
    class: Drupal\xedc_member\Service\PublicProfileBuilder
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@xedc_member.alias_manager'
      - '@date.formatter'
      - '@file_url_generator'
      - '@xedc_core.video_duration_formatter'
      - '@request_stack'
      - '@entity.repository'
      - '@current_user'

  xedc_member.alias_subscriber:
    class: Drupal\xedc_member\EventSubscriber\MemberAliasSubscriber
    arguments:
      - '@xedc_member.alias_manager'
      - '@current_user'
      - '@current_route_match'
    tags:
      - { name: event_subscriber }
