xedc_core.settings:
  type: config_object
  label: 'XEDC image import settings'
  mapping:
    max_archive_bytes:
      type: integer
      label: 'Maximum archive size'
    max_uncompressed_bytes:
      type: integer
      label: 'Maximum uncompressed size'
    max_files:
      type: integer
      label: 'Maximum file count'
    max_depth:
      type: integer
      label: 'Maximum directory depth'
    max_pixels:
      type: integer
      label: 'Maximum image pixels'
    max_image_bytes:
      type: integer
      label: 'Maximum image bytes'
    batch_size:
      type: integer
      label: 'Images per batch'
    time_budget:
      type: integer
      label: 'Worker time budget'
    failed_retention_hours:
      type: integer
      label: 'Failed archive retention'
    netdata_base_url:
      type: string
      label: 'Netdata base URL'
    file_scan_batch:
      type: integer
      label: 'Files per scan batch'
    file_scan_seconds:
      type: integer
      label: 'Seconds per scan batch'
    file_large_bytes:
      type: integer
      label: 'Large file threshold'
    file_huge_bytes:
      type: integer
      label: 'Huge file threshold'
    file_stale_days:
      type: integer
      label: 'Stale file age in days'
    file_top_files:
      type: integer
      label: 'Top file count'
    file_top_dirs:
      type: integer
      label: 'Top directory count'
    file_analysis_auto:
      type: integer
      label: 'Automatic read-only file analysis'
    file_analysis_interval:
      type: integer
      label: 'Seconds between automatic analysis runs'
    file_analysis_batch:
      type: integer
      label: 'Files per analysis batch'
    file_analysis_seconds:
      type: integer
      label: 'Seconds per analysis batch'
    file_analysis_suggest:
      type: integer
      label: 'Create unconfirmed cleanup suggestions'
    file_hash_max_bytes:
      type: integer
      label: 'Maximum bytes hashed in one file'
    file_quarantine_days:
      type: integer
      label: 'Days a quarantined file must be kept'
