services:
  logger.channel.xedc_core:
    parent: logger.channel_base
    arguments: ['xedc_core']

  xedc_core.tasks:
    class: Drupal\xedc_core\TaskRepository
    arguments: ['@database', '@state', '@datetime.time']

  xedc_core.alt:
    class: Drupal\xedc_core\AltManager
    arguments: ['@database', '@entity_type.manager']

  xedc_core.archive:
    class: Drupal\xedc_core\ArchiveManager
    arguments: ['@file_system', '@stream_wrapper_manager', '@file.usage', '@config.factory', '@current_user']

  xedc_core.cleaner:
    class: Drupal\xedc_core\TempCleaner
    arguments: ['@file_system', '@file.usage', '@xedc_core.tasks', '@config.factory', '@logger.channel.xedc_core']

  xedc_core.images:
    class: Drupal\xedc_core\ImagePipeline
    arguments: ['@file_system', '@config.factory', '@xedc_core.alt', '@xedc_core.tasks', '@logger.channel.xedc_core']

  xedc_core.publisher:
    class: Drupal\xedc_core\Publisher
    arguments: ['@xedc_core.tasks', '@entity_type.manager', '@content_moderation.moderation_information', '@database', '@xedc_core.alt']

  xedc_core.processor:
    class: Drupal\xedc_core\ImportProcessor
    arguments: ['@xedc_core.tasks', '@xedc_core.archive', '@xedc_core.images', '@xedc_core.alt', '@xedc_core.cleaner', '@lock', '@queue', '@config.factory', '@entity_type.manager', '@account_switcher', '@logger.channel.xedc_core']

  xedc_core.task_access:
    class: Drupal\xedc_core\Access\TaskAccess
    arguments: ['@xedc_core.tasks', '@entity_type.manager']

  xedc_core.netdata:
    class: Drupal\xedc_core\Ops\NetdataClient
    arguments: ['@http_client']

  xedc_core.monitor:
    class: Drupal\xedc_core\Ops\ServerMonitor
    arguments: ['@xedc_core.netdata', '@cache.default', '@datetime.time', '@date.formatter', '@config.factory', '@logger.channel.xedc_core']

  xedc_core.disk:
    class: Drupal\xedc_core\Ops\DiskOverview
    arguments: ['@cache.default', '@datetime.time']

  xedc_core.file_scanner:
    class: Drupal\xedc_core\Ops\FileScanner
    arguments: ['@keyvalue', '@queue', '@lock', '@config.factory', '@file_system', '@database', '@datetime.time', '@logger.channel.xedc_core']

  xedc_core.media_census:
    class: Drupal\xedc_core\Ops\MediaCensus
    arguments: ['@entity_type.manager', '@entity_field.manager', '@database', '@file_system', '@cache.default', '@datetime.time', '@config.factory', '@logger.channel.xedc_core']

  xedc_core.file_path_guard:
    class: Drupal\xedc_core\Ops\Cleanup\FilePathGuard
    arguments: ['@file_system']

  xedc_core.cleanup_repository:
    class: Drupal\xedc_core\Ops\Cleanup\CleanupRepository
    arguments: ['@database', '@datetime.time']

  xedc_core.duplicate_scanner:
    class: Drupal\xedc_core\Ops\Cleanup\DuplicateFileScanner
    arguments: ['@database', '@file_system', '@xedc_core.cleanup_repository', '@xedc_core.file_path_guard']

  xedc_core.reference_analyzer:
    class: Drupal\xedc_core\Ops\Cleanup\FileReferenceAnalyzer
    arguments: ['@entity_type.manager', '@entity_field.manager', '@database', '@file_system', '@xedc_core.cleanup_repository', '@xedc_core.file_path_guard']

  xedc_core.unused_scanner:
    class: Drupal\xedc_core\Ops\Cleanup\UnusedFileScanner
    arguments: ['@database', '@file_system', '@entity_type.manager', '@xedc_core.cleanup_repository', '@xedc_core.file_path_guard']

  xedc_core.reference_merger:
    class: Drupal\xedc_core\Ops\Cleanup\FileReferenceMerger
    arguments: ['@entity_type.manager', '@file.usage', '@xedc_core.reference_analyzer', '@xedc_core.cleanup_repository', '@state']

  xedc_core.quarantine_manager:
    class: Drupal\xedc_core\Ops\Cleanup\FileQuarantineManager
    arguments: ['@entity_type.manager', '@file_system', '@xedc_core.file_path_guard', '@xedc_core.reference_analyzer', '@xedc_core.cleanup_repository', '@config.factory', '@datetime.time']

  xedc_core.cleanup_manager:
    class: Drupal\xedc_core\Ops\Cleanup\FileCleanupManager
    arguments: ['@xedc_core.cleanup_repository', '@xedc_core.reference_analyzer', '@xedc_core.reference_merger', '@xedc_core.quarantine_manager', '@xedc_core.file_path_guard', '@entity_type.manager', '@file_system', '@config.factory', '@lock', '@queue', '@datetime.time']

  xedc_core.file_analysis:
    class: Drupal\xedc_core\Ops\Cleanup\FileAnalysisRunner
    arguments: ['@xedc_core.duplicate_scanner', '@xedc_core.reference_analyzer', '@xedc_core.unused_scanner', '@xedc_core.cleanup_manager', '@xedc_core.cleanup_repository', '@database', '@config.factory', '@lock', '@queue', '@state', '@datetime.time', '@logger.channel.xedc_core']
