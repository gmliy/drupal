  defaults:
    _form: '\Drupal\xedc_core\Form\TaskActionForm'
    _title: '重新随机封面'
    op: reroll
  requirements:
    _custom_access: '\Drupal\xedc_core\Access\TaskAccess::view'
  options:
    _admin_route: TRUE
