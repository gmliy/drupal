xedc_core.import_list:
  path: '/admin/content/image-imports'
  defaults:
    _form: '\Drupal\xedc_core\Form\ImportListForm'
    _title: '图片批量导入'
  requirements:
    _permission: 'import photo archives+administer xedc image imports'
  options:
    _admin_route: TRUE

xedc_core.import_detail:
  path: '/admin/content/image-imports/{task}'
  defaults:
    _controller: '\Drupal\xedc_core\Controller\ImportController::detail'
    _title: '导入任务'
  requirements:
    _custom_access: '\Drupal\xedc_core\Access\TaskAccess::view'
  options:
    _admin_route: TRUE
    parameters:
      task:
        type: integer

