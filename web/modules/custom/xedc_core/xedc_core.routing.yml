xedc_core.monitor:
  path: '/admin/reports/xedc-monitor'
  defaults:
    _controller: '\Drupal\xedc_core\Controller\MonitorController::page'
    _title: '服务器监控'
  requirements:
    _permission: 'access xedc server monitor'
  options:
    _admin_route: TRUE

xedc_core.monitor_data:
  path: '/admin/reports/xedc-monitor/data'
  defaults:
    _controller: '\Drupal\xedc_core\Controller\MonitorController::data'
  requirements:
    _permission: 'access xedc server monitor'
  options:
    _admin_route: TRUE

xedc_core.files:
  path: '/admin/reports/xedc-files'
  defaults:
    _controller: '\Drupal\xedc_core\Controller\FileStatsController::page'
    _title: '文件统计'
  requirements:
    _permission: 'access xedc file statistics'
  options:
    _admin_route: TRUE

xedc_core.files_status:
  path: '/admin/reports/xedc-files/status'
