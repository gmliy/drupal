administer xedc image imports:
  title: '管理全部图片导入任务'
  description: '查看、重试、取消、清理和发布所有图片导入任务，并选择服务器上的压缩包。'
  restrict access: true

import photo archives:
  title: '为自己的图片内容导入压缩包'
  description: '在自己有权编辑的图片内容上上传 ZIP 或 7Z。'

publish xedc image imports:
  title: '发布已完成的图片导入'
  description: '把导入完成且校验通过的图片内容发布到网站。'
  restrict access: true

access xedc server monitor:
  title: '查看服务器监控'
  description: '查看本机 Netdata 采集的 CPU、内存、磁盘、网络和服务资源。'
  restrict access: true

access xedc file statistics:
  title: '查看服务器文件统计'
  description: '查看固定目录的占用、媒体统计和只读异常报告。不能通过此权限删除文件。'
  restrict access: true

view xedc duplicate files:
  title: '查看重复文件'
  description: '查看 SHA-256 重复文件分组和引用分析。不能通过此权限合并或删除文件。'
  restrict access: true

view xedc unused files:
  title: '查看未引用文件'
  description: '查看文件引用分类。未知引用不会被显示成可以删除。'
  restrict access: true

view xedc file references:
  title: '查看文件引用详情'
  description: '查看文件被哪些内容、修订、翻译和自定义表使用。不能通过此权限修改或删除文件。'
  restrict access: true

create xedc cleanup plans:
  title: '创建文件清理方案'
  description: '根据扫描结果创建待审核方案。不能通过此权限执行合并、隔离或删除。'
  restrict access: true

review xedc cleanup plans:
  title: '审核文件清理方案'
  description: '查看清理方案和其中的文件清单。'
  restrict access: true

confirm xedc reference merge:
  title: '确认引用合并'
  description: '确认把重复文件的已识别引用迁移到保留文件。不会因此删除物理文件。'
  restrict access: true

confirm xedc file quarantine:
  title: '确认文件隔离'
  description: '确认把已经审核的文件移入私有隔离目录。'
  restrict access: true

confirm xedc file purge:
  title: '确认永久清理'
  description: '在隔离保留期之后再次确认，永久删除隔离文件。'
  restrict access: true

restore xedc quarantined files:
  title: '恢复隔离文件'
  description: '把隔离文件恢复到原来的位置。不会覆盖已存在的其他文件。'
  restrict access: true

view xedc cleanup logs:
  title: '查看文件清理日志'
  description: '查看清理操作记录。不能通过此权限修改日志。'
  restrict access: true

administer xedc object storage:
  title: '管理对象存储'
  description: '管理供应商配置、连接测试和迁移预检查。不能通过此权限删除业务文件或改写文件 URI。'
  restrict access: true

view xedc storage status:
  title: '查看存储状态'
  description: '查看对象存储运行状态。不能修改供应商或切换存储。'
  restrict access: true

manage xedc storage providers:
  title: '管理存储供应商'
  description: '添加和编辑供应商配置。不能通过此权限删除正在使用的供应商。'
  restrict access: true

manage xedc storage policy:
  title: '管理存储策略'
  description: '修改对象存储策略配置。不能通过此权限改写已有文件 URI。'
  restrict access: true

switch xedc storage mode:
  title: '切换存储模式'
  description: '预留的切换权限。后台页面目前不会执行生产切换。'
  restrict access: true

migrate xedc storage:
  title: '执行存储迁移'
  description: '执行对象存储迁移。默认只复制，不删除源文件。'
  restrict access: true

test xedc storage writes:
  title: '执行存储写入测试'
  description: '对专用测试前缀做写入探针。不能接触正式对象。'
  restrict access: true

view xedc storage logs:
  title: '查看存储日志'
  description: '查看对象存储操作记录。记录里没有凭证。'
  restrict access: true

download xedc protected files:
  title: '下载受保护对象文件'
  description: '经过 Drupal 权限检查后获取短时有效的受保护对象地址。不能通过此权限访问本地私有文件。'
  restrict access: true

administer xedc downloads:
  title: '管理下载资源'
  description: '创建、修改、停用和删除内容的下载资源。不能通过此权限绕过 VIP 下载限制。'
  restrict access: true

administer xedc vip:
  title: '管理 VIP 会员'
  description: '开通、延长、取消 VIP，并查看开通和到期记录。'
  restrict access: true

view xedc engagement statistics:
  title: '查看互动统计'
  description: '查看点赞、下载和分享统计。不能通过此权限修改会员或下载资源。'
  restrict access: true

administer xedc image optimization:
  title: '管理图片优化'
  description: '查看优化记录、修改质量设置、重试或取消排队任务。不能通过此权限删除历史图片。'
  restrict access: true

administer xedc engagement:
  title: '管理互动记录'
  description: '把点赞标为有效或已取消。不能通过此权限删除记录或查看游客身份原文。'
  restrict access: true
