services:
  xedc_admin_ui.dashboard_stats:
    class: Drupal\xedc_admin_ui\DashboardStats
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@cache.default'
      - '@language_manager'
      - '@file_url_generator'

  xedc_admin_ui.dashboard_shortcuts:
    class: Drupal\xedc_admin_ui\DashboardShortcutLinks
    arguments:
      - '@entity_type.manager'

  xedc_admin_ui.dashboard_hubs:
    class: Drupal\xedc_admin_ui\DashboardHubCards
