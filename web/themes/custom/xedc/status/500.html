<html lang="zh-Hans" class="xs-doc">
<head>
<meta charset="utf-8">

<style>
:root{--xn-bg:#fff;--xn-fg:#09090b;--xn-muted:#71717a;--xn-border:#e4e4e7;--xn-accent:#f4f4f5;--xn-pri:#18181b;--xn-pri-fg:#fafafa;--xn-bgrgb:255,255,255;--xn-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px -8px rgba(0,0,0,.14)}
[data-bs-theme=dark],[data-theme=dark]{--xn-bg:#09090b;--xn-fg:#fafafa;--xn-muted:#a1a1aa;--xn-border:#27272a;--xn-accent:#18181b;--xn-pri:#fafafa;--xn-pri-fg:#18181b;--xn-bgrgb:9,9,11;--xn-shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.6)}
.xn,.xn-sheet,.xn-overlay{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.xn svg,.xn-sheet svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.xn{position:sticky;top:0;z-index:1030;background:rgba(var(--xn-bgrgb),.92);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--xn-border);box-shadow:var(--xn-shadow);color:var(--xn-fg)}
.xn-bar{display:flex;align-items:center;gap:32px;height:60px;max-width:1920px;margin:0 auto;padding:0 20px}
.xn-left{display:flex;align-items:center;gap:20px;flex:none}

/* logo */
.xn-logo{display:inline-flex;align-items:baseline;font-size:1.25rem;font-weight:600;letter-spacing:-.02em;line-height:1;color:#111827;text-decoration:none;flex:none;white-space:nowrap}
.xn-logo:hover{color:#111827}
.xn-dot{display:inline-block;width:.28em;height:.28em;margin-left:.08em;border-radius:50%;background:#f472b6;transform:translateY(-.04em)}
@media(min-width:992px){.xn-logo{font-size:1.375rem}}

/* links（禁止换行） */
.xn-links{display:flex;align-items:center;gap:2px;flex:none}
.xn-link,.xn-dd{white-space:nowrap;flex:none}
.xn-link{padding:6px 12px;border-radius:6px;font-size:.9375rem;font-weight:500;color:var(--xn-muted);text-decoration:none;transition:background .15s,color .15s}
.xn-link:hover{background:var(--xn-accent);color:var(--xn-fg)}
.xn-link[aria-current]{color:var(--xn-fg)}

/* 下拉 */
.xn-dd{position:relative;display:flex;align-items:center;border-radius:6px;transition:background .15s}
.xn-dd:hover,.xn-dd.open{background:var(--xn-accent)}
.xn-dd>.xn-link{padding-right:2px;background:none}
.xn-dd:hover>.xn-link,.xn-dd.open>.xn-link{color:var(--xn-fg)}
.xn .xn-dd-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:30px;margin-right:6px;padding:0;border:0;background:none;color:var(--xn-muted);cursor:pointer}
.xn .xn-dd-btn svg{width:14px;height:14px;transition:transform .2s}
.xn-dd:hover .xn-dd-btn svg,.xn-dd.open .xn-dd-btn svg{transform:rotate(180deg)}
.xn-dd-panel{position:absolute;top:100%;left:0;padding-top:10px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility 0s .15s;z-index:5}
.xn-dd:hover .xn-dd-panel,.xn-dd.open .xn-dd-panel{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.xn-dd-card{min-width:240px;padding:12px;background:var(--xn-bg);border:1px solid var(--xn-border);border-radius:10px;box-shadow:0 12px 32px -8px rgba(0,0,0,.2)}
.xn-dd-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(130px,1fr));gap:6px 12px}
.xn-dd-col{display:flex;flex-direction:column}
.xn-dd-h,.xn-dd-i{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.xn-dd-h{font-size:14px;font-weight:600;color:var(--xn-fg)}
.xn-dd-i{font-size:13px;color:var(--xn-muted)}
.xn-dd-h:hover,.xn-dd-i:hover{background:var(--xn-accent);color:var(--xn-fg)}
.xn-dd-all{display:block;margin-top:10px;padding:10px 8px 2px;border-top:1px solid var(--xn-border);font-size:13px;color:var(--xn-muted);text-decoration:none}
.xn-dd-all:hover{color:var(--xn-fg)}

/* search */
.xn-search,.xn-msearch{position:relative;display:flex;align-items:center}
.xn-search svg,.xn-msearch svg{position:absolute;left:10px;width:16px;height:16px;color:var(--xn-muted);pointer-events:none}
.xn-search input,.xn-msearch input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--xn-border);border-radius:8px;background:transparent;color:var(--xn-fg);font-size:14px;outline:0;-webkit-appearance:none;appearance:none;transition:box-shadow .15s,border-color .15s}
.xn-search input::placeholder,.xn-msearch input::placeholder{color:var(--xn-muted)}
.xn-search input:focus,.xn-msearch input:focus{border-color:var(--xn-fg);background:var(--xn-bg);background-color:var(--xn-bg)!important;box-shadow:none;outline:none}
@media (max-width:767px){.xn-search input,.xn-msearch input{font-size:16px}}
.xn-msearch{display:none;padding:0 20px 12px}
.xn-msearch svg{left:30px;top:11px}
.xn-msearch input{font-size:16px}
.xn-search-open .xn-msearch{display:flex}

/* actions（图标放大） */
.xn-actions{display:flex;align-items:center;gap:2px}
.xn-lang{position:relative;display:inline-flex;align-items:center}
.xn .xn-lang-btn,.xn-sheet .xn-lang-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;margin:0;padding:0 12px;border:0;border-radius:8px;background:transparent;box-shadow:none;color:var(--xn-muted);font:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;-webkit-appearance:none;appearance:none}
.xn .xn-lang-btn svg,.xn-sheet .xn-lang-btn svg{width:14px;height:14px;transition:transform .2s}
.xn .xn-lang-btn:hover,.xn .xn-lang.open .xn-lang-btn,.xn-sheet .xn-lang-btn:hover,.xn-sheet .xn-lang.open .xn-lang-btn{color:var(--xn-fg);background:var(--xn-accent)}
.xn .xn-lang.open .xn-lang-btn svg,.xn-sheet .xn-lang.open .xn-lang-btn svg{transform:rotate(180deg)}
.xn .xn-lang-btn:focus-visible,.xn-sheet .xn-lang-btn:focus-visible{outline:2px solid var(--xn-border);outline-offset:2px}
.xn-lang-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:148px;padding:6px;background:var(--xn-bg);border:1px solid var(--xn-border);border-radius:10px;box-shadow:0 12px 32px -8px rgba(0,0,0,.2);z-index:6}
.xn-lang-menu a{display:flex;align-items:center;min-height:40px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:500;color:var(--xn-fg);text-decoration:none;white-space:nowrap}
.xn-lang-menu a:hover{background:var(--xn-accent);color:var(--xn-fg)}
.xn-lang--sheet{position:relative;display:flex;flex-direction:column;align-items:stretch;flex:none;width:auto;max-width:100%;margin:0 10px 8px}
.xn-sheet .xn-lang--sheet .xn-lang-btn{justify-content:space-between;width:100%;min-height:48px;padding:0 12px;border:0;border-radius:8px;background:transparent;box-shadow:none;color:var(--xn-fg);font-size:15px;font-weight:500}
.xn-sheet .xn-lang--sheet .xn-lang-current{display:inline-flex;align-items:center;gap:8px;min-width:0}
.xn-sheet .xn-lang--sheet .xn-lang-current span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.xn-sheet .xn-lang--sheet .xn-lang-btn svg{width:16px;height:16px;margin:0;color:var(--xn-muted);flex:none}
.xn-sheet .xn-lang--sheet .xn-lang-btn .xn-lang-globe{width:18px;height:18px}
.xn-sheet .xn-lang.open .xn-lang-btn .xn-lang-globe{transform:none}
.xn-sheet .xn-lang--sheet .xn-lang-btn:active,.xn-sheet .xn-lang--sheet.open .xn-lang-btn{background:var(--xn-accent)}
.xn-lang--sheet .xn-lang-menu{position:static;top:auto;right:auto;bottom:auto;left:auto;display:flex;flex-direction:column;width:100%;min-width:0;max-height:0;margin:0;padding:0;overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none;opacity:0;visibility:hidden;pointer-events:none;transition:max-height .2s ease,opacity .2s ease}
.xn-lang--sheet.open .xn-lang-menu{max-height:11rem;margin-top:2px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;opacity:1;visibility:visible;pointer-events:auto}
.xn-lang--sheet .xn-lang-menu a{min-height:44px;max-width:100%;padding:0 12px 0 38px;border-radius:8px;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.xn-lang--sheet .xn-lang-menu a:active{background:var(--xn-accent)}
.xn-icon{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--xn-fg);cursor:pointer;text-decoration:none;transition:background .15s}
.xn .xn-icon svg,.xn-sheet .xn-icon svg{width:22px;height:22px}
.xn-icon:hover{background:var(--xn-accent);color:var(--xn-fg)}
.xn-account{overflow:visible;transform-origin:center;transition:transform .12s ease,opacity .12s ease;-webkit-tap-highlight-color:transparent}
a.xn-icon.xn-account,
a.xn-icon.xn-account:hover,
a.xn-icon.xn-account:focus,
a.xn-icon.xn-account:active,
a.xn-icon.xn-account:focus-visible,
a.xn-icon.xn-account.is-pressed{background:transparent!important;background-color:transparent!important;box-shadow:none!important}
a.xn-icon.xn-account:active,
a.xn-icon.xn-account.is-pressed{transform:scale(.95);opacity:.72}
a.xn-icon.xn-account:active .xn-avatar,
a.xn-icon.xn-account.is-pressed .xn-avatar{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.xn-account:focus-visible{outline:none}
.xn-account:focus-visible .xn-avatar,
.xn-account:focus-visible svg{outline:2px solid var(--xn-border);outline-offset:2px}
.xn-avatar{display:block;width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:center;background:#f7f7f8;flex:none}
.xn-text{display:inline-flex;align-items:center;padding:6px 10px;border-radius:6px;font-size:14px;font-weight:500;color:var(--xn-muted);text-decoration:none;white-space:nowrap;transition:color .15s,background .15s}
.xn-text:hover{color:var(--xn-fg);background:var(--xn-accent)}
.xn-btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid transparent;transition:background .15s,opacity .15s}
.xn-btn-ghost{color:var(--xn-fg)}
.xn-btn-ghost:hover{background:var(--xn-accent);color:var(--xn-fg)}
.xn-btn-primary{background:var(--xn-pri);color:var(--xn-pri-fg)}
.xn-btn-primary:hover{opacity:.9;color:var(--xn-pri-fg)}
.xn-sun{display:none}
[data-bs-theme=dark] .xn-sun,[data-theme=dark] .xn-sun{display:block}
[data-bs-theme=dark] .xn-moon,[data-theme=dark] .xn-moon{display:none}

.xn-only-m{display:none}

/* 桌面：搜索框居中，与栏目保持距离 */
@media (min-width:992px){
  .xn-search{flex:1 1 auto;min-width:160px;max-width:360px;margin:0 auto}
  .xn-bar{padding-right:20px}
  .xn-actions .xn-theme{order:8}
  .xn-actions .xn-lang{order:9;margin-left:2px}
  .xn-sheet,.xn-overlay{display:none}
}
@media (min-width:1400px){
  .xn-bar{display:grid;grid-template-columns:1fr clamp(260px,24vw,360px) 1fr;column-gap:48px;padding-right:24px}
  .xn-search{max-width:none;margin:0}
  .xn-actions{justify-self:end}
}

/* 手机 */
@media (max-width:991.98px){
  .xn-links,.xn-search,.xn-only-d,.xn-actions .xn-lang{display:none}
  .xn-only-m{display:inline-flex}
  .xn-actions{margin-left:auto}
  .xn-bar{gap:4px;padding:0 8px 0 16px}
}

/* 左侧抽屉（更窄） */
.xn-overlay{position:fixed;inset:0;z-index:1040;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.xn-sheet{position:fixed;top:0;left:0;right:auto;bottom:0;z-index:1050;display:flex;flex-direction:column;width:min(62vw,240px);background:var(--xn-bg);color:var(--xn-fg);border-right:1px solid var(--xn-border);box-shadow:8px 0 30px rgba(0,0,0,.1);transform:translate3d(-100%,0,0);visibility:hidden;transition:transform .3s cubic-bezier(.32,.72,0,1),visibility 0s .3s}
html.xn-open{overflow:hidden}
html.xn-open .xn-overlay{opacity:1;visibility:visible;transition-delay:0s}
html.xn-open .xn-sheet{transform:none;visibility:visible;transition-delay:0s}
.xn-sheet-head{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 6px 0 18px;border-bottom:1px solid var(--xn-border);flex:none}
.xn-sheet-nav{flex:1;min-height:0;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.xn-row{display:flex;align-items:center}
.xn-row>a{flex:1}
.xn-m-link,.xn-m-sub{display:block;padding:11px 12px;border-radius:6px;font-size:15px;font-weight:500;color:var(--xn-fg);text-decoration:none}
.xn-m-link:active,.xn-m-sub:active,.xn-m-link:hover,.xn-m-sub:hover{background:var(--xn-accent);color:var(--xn-fg)}
.xn-m-link[aria-current]{background:var(--xn-accent)}
.xn-m-sub{font-size:14px;font-weight:400;color:var(--xn-muted)}
.xn-m-sub[aria-current]{color:var(--xn-fg);font-weight:500}
.xn-m-sub2{padding-left:14px}
.xn-chev{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:6px;background:transparent;color:var(--xn-muted);cursor:pointer}
.xn-chev svg{transition:transform .2s}
.xn-acc.open>.xn-row>.xn-chev svg{transform:rotate(180deg)}
.xn-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.xn-panel>div{overflow:hidden;visibility:hidden;min-height:0;margin-left:12px;padding-left:8px;border-left:1px solid var(--xn-border);transition:visibility 0s .25s}
.xn-acc.open>.xn-panel{grid-template-rows:1fr}
.xn-acc.open>.xn-panel>div{visibility:visible;transition-delay:0s}
.xn-sheet-foot{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--xn-border);flex:none}
.xn-sheet-actions{display:flex;gap:8px}
.xn-sheet-actions .xn-btn{flex:1;padding:0 8px;border-color:var(--xn-border)}
.xn-sheet-actions .xn-btn-primary{border-color:transparent}

/* 首页卡片标题：最多两行，内边距改外边距，避免第三行从 padding 里露出来 */
.xedc-card__title:not([style]){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0;margin:10px 12px;line-height:1.4}

body[class*="toolbar"] header.xn{z-index:200;top:var(--drupal-displace-offset-top,0px)}

.xedc-footer{margin:0;padding:12px 20px;border-top:0;background:transparent;color:#6b7280;font-size:.875rem;line-height:1.5;text-align:center}.xedc-footer a{color:#6b7280;text-decoration:none}.xedc-footer a:hover{color:#111827;text-decoration:underline;text-underline-offset:.22em}
/* Status pages. Scoped to html.xs-doc so normal pages stay unchanged. */

html.xs-doc,
.xs {
  --xs-bg: #fff;
  --xs-fg: #09090b;
  --xs-muted: #52525b;
  --xs-faint: #71717a;
  --xs-border: #e4e4e7;
  --xs-pri: #18181b;
  --xs-pri-fg: #fafafa;
  --xs-soft: rgba(9, 9, 11, .06);
  color-scheme: light;
  background: var(--xs-bg);
  color: var(--xs-fg);
}

html.xs-doc[data-bs-theme="dark"],
html.xs-doc[data-theme="dark"],
html[data-bs-theme="dark"] .xs,
html[data-theme="dark"] .xs {
  --xs-bg: #09090b;
  --xs-fg: #fafafa;
  --xs-muted: #a1a1aa;
  --xs-faint: #a1a1aa;
  --xs-border: #3f3f46;
  --xs-pri: #fafafa;
  --xs-pri-fg: #18181b;
  --xs-soft: rgba(250, 250, 250, .08);
  color-scheme: dark;
}

html:has(.xs) {
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
  background: #fff;
}

html.xs-doc body,
body:has(.xs) {
  display: flex;
  flex-direction: column;
  margin: 0;
  height: 100%;
  height: 100dvh;
  max-height: 100dvh;
  background: #fff;
  color: var(--xs-fg, #09090b);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body:has(.xs) .dialog-off-canvas-main-canvas,
body:has(.xs) .page {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  overflow: hidden;
}

body:has(.xs) .xn,
body:has(.xs) .xedc-footer {
  flex: none;
}

body:has(.xs) .xedc-footer {
  margin: 0;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  border-top: 0;
  background: transparent;
}

body:has(.xs) .xedc-footer a {
  white-space: nowrap;
}

html[data-bs-theme="dark"]:has(.xs),
html[data-theme="dark"]:has(.xs),
html[data-bs-theme="dark"] body:has(.xs),
html[data-theme="dark"] body:has(.xs),
html.xs-doc[data-bs-theme="dark"] body,
html.xs-doc[data-theme="dark"] body {
  background: #09090b;
  color: #fafafa;
}

.xs {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 32px 12px;
  overflow: hidden;
  background: transparent;
  color: var(--xs-fg);
}

.xs *,
.xs *::before,
.xs *::after {
  box-sizing: border-box;
}

.xs-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(18px + env(safe-area-inset-top)) 24px 0;
}

.xs-logo {
  display: inline-flex;
  align-items: baseline;
  color: var(--xs-fg);
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1;
  text-decoration: none;
}

.xs-logo i {
  width: .28em;
  height: .28em;
  margin-left: .08em;
  border-radius: 50%;
  background: #f472b6;
  transform: translateY(-.04em);
}

.xs-theme {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--xs-border);
  border-radius: 999px;
  background: transparent;
  color: var(--xs-fg);
  cursor: pointer;
}

.xs-theme svg {
  width: 18px;
  height: 18px;
}

.xs-theme .xs-sun { display: none; }
html[data-bs-theme="dark"] .xs-theme .xs-moon,
html[data-theme="dark"] .xs-theme .xs-moon { display: none; }
html[data-bs-theme="dark"] .xs-theme .xs-sun,
html[data-theme="dark"] .xs-theme .xs-sun { display: block; }

.xs svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.xs-group {
  position: static;
  z-index: auto;
  width: min(100%, 46rem);
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: xs-in .7s ease both;
}

.xs-stage {
  display: grid;
  place-items: center;
  width: 100%;

/* Shared geometric motion. Stroke 1.5, radius 6–16, transform and opacity only. */

.xs-fit {
  position: relative;
  width: 340px;
  max-width: 100%;
  aspect-ratio: 2 / 1;
}

.xs-fit-inner {
  position: absolute;
  top: 0;
  left: 0;
  width: 320px;
  height: 160px;
  transform-origin: top left;
  transform: scale(1.0625);
  color: var(--xs-fg);
}

.xs-fit svg {
  display: block;
  overflow: visible;
  stroke-width: 1.5;
}

.xs-fit .xs-ring {
  fill: none;
  stroke: currentColor;
  stroke-opacity: .42;
}

.xs-fit .xs-core {
  fill: currentColor;
  stroke: none;
}

.xs-fit .xs-plate {
  fill: var(--xs-soft);
  stroke: currentColor;
  stroke-width: 1.5;
}

.xs-mover {
  position: absolute;
  top: 0;
  left: 0;
  width: 5px;
  height: 5px;
  offset-anchor: center;
  offset-rotate: 0deg;
}

.xs-mover::before,
.xs-mover::after {
  content: "";
  position: absolute;
}

.xs-mover::before {
  inset: -5.5px;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  opacity: .42;
}

.xs-mover::after {
  inset: 0;
  border-radius: 50%;
  background: currentColor;
}

.xs-pin {

/* 403: the node is turned away, then the entrance locks. */
.xs-403 svg {
  perspective: 720px;
}

.xs-403-track {
  fill: none;
  stroke: currentColor;

  stroke: currentColor;
}

  transform-box: view-box;
  transform-origin: 132px 84px;
  animation: xs-door 9s linear infinite;
}

.xs-403-lock {
  opacity: 1;
  animation: xs-lock 9s linear infinite;
}

.xs-403-shackle {
  fill: none;
  stroke: currentColor;
  stroke-dasharray: 64;
  stroke-dashoffset: 0;
  animation: xs-shackle 9s linear infinite;
}

.xs-fit .xs-403-body {
  fill: var(--xs-bg);
  stroke: currentColor;
}

.xs-fit .xs-403-key {
  fill: currentColor;
  stroke: none;
  opacity: 1;
  transform-box: fill-box;
  transform-origin: center;
  animation: xs-key 9s linear infinite;
}

  56%, 100% { transform: perspective(360px) rotateY(0deg); }
}

@keyframes xs-lock {

}

@keyframes xs-shackle {

.xs-500-ghost {

.xs-500-a,
.xs-500-b,
.xs-500-c,

  46% { transform: translate(5px, 16px) rotate(2deg); animation-timing-function: cubic-bezier(.3, 1.2, .35, 1); }
  54% { transform: translate(7px, 9px) rotate(3deg); }
  62% { transform: translate(4px, 14px) rotate(1deg); animation-timing-function: cubic-bezier(.22, 1.2, .36, 1); }
  76% { transform: translate(0, -2px); }

/* 502: the link draws, breaks, and fails a second attempt. */
.xs-502-arm {
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-dasharray: 2.2 5;
  transform-box: view-box;
  transform: scaleX(.58);

.xs-503-a,
.xs-503-b,
.xs-503-c,

.xs-503-b { animation: xs-503-b 9.6s linear infinite; }

  40%, 76% { transform: none; opacity: 1; }
  90% { transform: translateX(8px); opacity: .25; }

@keyframes xs-503-c {

  26% { opacity: 1; animation-timing-function: cubic-bezier(.22, 1.2, .36, 1); }

/* 429: nodes travel a rail and wait at a gate. */
.xs-429-rail {
  fill: none;

  stroke-opacity: .3;
  stroke-dasharray: 1.5 7;

.xs-fit .xs-429-gate {

.xs-429-n {

  animation-duration: 8.8s;

.xs-429.is-holding .xs-429-n {

  animation-delay: 0s;
}

.xs-429.is-holding .xs-429-n:nth-of-type(1) { animation-name: xs-form1; }

.xs-429.is-holding .xs-429-n:nth-of-type(3) { animation-name: xs-form3; animation-delay: .16s; }
.xs-429.is-holding .xs-429-n:nth-of-type(4) { animation-name: xs-form4; animation-delay: .24s; }
.xs-429.is-holding .xs-429-n:nth-of-type(5) { animation-name: xs-form5; animation-delay: .32s; }

.xs-429.is-ready .xs-429-n {

}

<script>
(function () {
  var d = document, h = d.documentElement;
  function qa(s, r) { return Array.prototype.slice.call((r || d).querySelectorAll(s)); }

  // 主题
  function setTheme(t, persist) {
    h.setAttribute('data-bs-theme', t); h.setAttribute('data-theme', t);
    if (persist) {
      try { localStorage.setItem('theme', t); } catch (e) {}
    }
  }
  try {
    var s = localStorage.getItem('theme');
    if (s !== 'dark' && s !== 'light') {
      s = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    setTheme(s, false);
  } catch (e) {}
  qa('[data-xn-theme]').forEach(function (b) {
    b.addEventListener('click', function () {
      setTheme(h.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark', true);
    });
  });

  // 抽屉与遮罩挂到 body，避免被父级 transform 影响 fixed 定位
  var sheet = d.getElementById('xn-sheet');
  var overlay = d.querySelector('.xn-overlay');
  if (overlay) d.body.appendChild(overlay);
  if (sheet) d.body.appendChild(sheet);

  function openSheet() { h.classList.add('xn-open'); if (sheet) sheet.setAttribute('aria-hidden', 'false'); }
  function closeSheet() { h.classList.remove('xn-open'); if (sheet) sheet.setAttribute('aria-hidden', 'true'); }
  qa('[data-xn-open]').forEach(function (b) { b.addEventListener('click', openSheet); });
  qa('[data-xn-close]').forEach(function (b) { b.addEventListener('click', closeSheet); });

  // 抽屉手风琴（默认收起）
  qa('.xn-chev').forEach(function (b) {
    b.addEventListener('click', function () {
      var acc = b.closest('.xn-acc');
      var on = acc.classList.toggle('open');
      b.setAttribute('aria-expanded', on ? 'true' : 'false');
    });
  });

  // PC 下拉：悬停（CSS）或点击箭头
  var dds = qa('.xn-dd');
  function closeDD() {
    dds.forEach(function (x) {
      x.classList.remove('open');
      x.querySelector('.xn-dd-btn').setAttribute('aria-expanded', 'false');
    });
  }
  dds.forEach(function (dd) {
    var b = dd.querySelector('.xn-dd-btn');
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var on = !dd.classList.contains('open');
      closeDD();
      closeLang();
      if (on) { dd.classList.add('open'); b.setAttribute('aria-expanded', 'true'); }
    });
  });

  var langs = qa('.xn-lang');
  function closeLang() {
    langs.forEach(function (el) { setLangOpen(el, false); });
  }
  function setLangOpen(el, on) {
    var langBtn = el.querySelector('.xn-lang-btn');
    var langMenu = el.querySelector('.xn-lang-menu');
    var sheetLang = el.classList.contains('xn-lang--sheet');
    el.classList.toggle('open', on);
    if (langBtn) langBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
    if (!langMenu) return;
    langMenu.setAttribute('aria-hidden', on ? 'false' : 'true');
    if (!sheetLang) langMenu.hidden = !on;
  }
  langs.forEach(function (el) {
    var langBtn = el.querySelector('.xn-lang-btn');
    if (!langBtn) return;
    langBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var on = !el.classList.contains('open');
      closeLang();
      closeDD();
      if (on) setLangOpen(el, true);
    });
  });
  d.addEventListener('click', function (e) {
    if (!e.target.closest('.xn-dd')) closeDD();
    if (!e.target.closest('.xn-lang')) closeLang();
  });
  d.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); closeDD(); closeLang(); } });
  window.addEventListener('resize', function () { if (window.innerWidth >= 992) closeSheet(); });

  // 手机搜索
  var hd = d.querySelector('[data-xn]');
  qa('[data-xn-search]').forEach(function (b) {
    b.addEventListener('click', function () {
      var on = hd.classList.toggle('xn-search-open');
      if (on) { var i = hd.querySelector('.xn-msearch input'); if (i) i.focus(); }
    });
  });

  // 会员头像：按下时保持一小段缩放，避免点按过快看不出反馈
  qa('.xn-account').forEach(function (a) {
    var timer;
    a.addEventListener('pointerdown', function () {
      a.classList.add('is-pressed');
      clearTimeout(timer);
      timer = setTimeout(function () { a.classList.remove('is-pressed'); }, 180);
    });
  });

  // 当前页高亮
  var cur = location.pathname.replace(/\/$/, '') || '/';
  qa('.xn-link,.xn-m-link,.xn-m-sub').forEach(function (a) {
    var p = a.pathname.replace(/\/$/, '') || '/';
    if (p === cur || (p !== '/' && cur.indexOf(p + '/') === 0)) a.setAttribute('aria-current', 'page');
  });
})();

  function setTheme(mode, persist) {
    var root = document.documentElement;
    root.setAttribute('data-bs-theme', mode);
    root.setAttribute('data-theme', mode);
    if (persist) {
      try {
        localStorage.setItem('theme', mode);
      }
      catch (e) {}
    }
  }

  function currentTheme() {
    var mode = document.documentElement.getAttribute('data-bs-theme');
    return mode === 'dark' ? 'dark' : 'light';
  }

  function bindMotion() {
    if (motionBound) {
      return;
    }
    motionBound = true;
    var reduce = false;
    try {
      reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
    catch (e) {}
    if (reduce) {
      return;
    }
    function sync() {
      document.documentElement.classList.toggle('xs-paused', document.hidden);
    }
    document.addEventListener('visibilitychange', sync);
    sync();
  }

  function formatWait(seconds) {
    if (seconds >= 60) {
      var minutes = Math.floor(seconds / 60);
      var rest = seconds % 60;
      return minutes + ' 分 ' + rest + ' 秒';
    }
    return seconds + ' 秒';
  }

  function bindWait(page) {
    var hold = page.querySelector('[data-xs-wait]');
    if (!hold) {
      return;
    }
    var total = parseInt(hold.getAttribute('data-xs-wait'), 10);
    if (!total || total < 1) {
      return;
    }
    var link = page.querySelector('[data-xs-retry]');
    var queue = page.querySelector('.xs-429');
    var template = hold.getAttribute('data-xs-wait-tpl') || '请等待 @count';
    var done = hold.getAttribute('data-xs-wait-done') || '可以重新尝试了';
    var ends = Date.now() + (total * 1000);
    if (queue) {
      queue.classList.add('is-holding');
    }
    if (link) {
      link.classList.add('is-disabled');
      link.setAttribute('aria-disabled', 'true');
    }
    function paint(left) {
      hold.textContent = left > 0 ? template.replace('@count', formatWait(left)) : done;
    }
    function tick() {
      var left = Math.max(0, Math.ceil((ends - Date.now()) / 1000));
      paint(left);
      if (left <= 0) {
        if (link) {
          link.classList.remove('is-disabled');
          link.removeAttribute('aria-disabled');
        }
        if (queue) {
          queue.classList.remove('is-holding');
          queue.classList.add('is-ready');
        }
        return;
      }
      window.setTimeout(tick, 250);
    }
    tick();
  }

  function init(root) {
    var pages = readyPages(root);
    if (!pages.length) {
      return;
    }
    bindMotion();
    pages.forEach(function (page) {
      page.setAttribute('data-xs-ready', '1');
      page.querySelectorAll('[data-xs-theme]').forEach(function (button) {
        button.addEventListener('click', function () {
          setTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
        });
      });
      page.querySelectorAll('[data-xs-back]').forEach(function (button) {
        button.addEventListener('click', function () {
          var home = button.getAttribute('data-xs-home') || '/';
          if (window.history.length > 1) {
            window.history.back();
            return;
          }
          window.location.href = home;
        });
      });
      page.addEventListener('click', function (event) {
        var link = event.target.closest('[aria-disabled="true"]');
        if (link) {
          event.preventDefault();
        }
      });
      bindWait(page);
    });
  }

  if (Drupal && Drupal.behaviors) {
    Drupal.behaviors.xedcStatus = {
      attach: function (context) {
        init(context);
      }
    };
  }
  else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      init(document);
    });
  }
  else {
    init(document);
  }
})(typeof Drupal === 'undefined' ? null : Drupal);

</script>
</body>
