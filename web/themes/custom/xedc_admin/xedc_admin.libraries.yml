global:
  version: 1.1
  css:
    theme:
      css/base.css: {}
      css/layout.css: {}
      css/components.css: {}
      css/content.css: {}
      css/forms.css: { weight: 20 }
      css/node-form.css: {}
      css/responsive.css: {}
      css/admin-ui.css: {}
      css/dialog.css: {}
      css/editor.css: {}
      css/progress.css: {}
  js:
    js/navigation.js: {}
    js/admin.js: {}
  dependencies:
    - core/drupal
    - core/once

dialog:
  version: 1.9
  css:
    theme:
      css/dialog.css: { weight: 50 }
  js:
    js/dialog-media.js: {}
  dependencies:
    # Do NOT depend on core/drupal.dialog here: libraries-extend already
    # attaches this library to that one, and a reverse dep loops until OOM.
    - core/drupal
    - core/once
    - core/jquery
    - core/drupalSettings

editor:
  css:
    theme:
      css/editor.css: {}

drawer:
  css:
    theme:
      css/layout.css: {}
  js:
    js/navigation.js: {}
  dependencies:
    - core/drupal
    - core/once

dashboard:
  css:
    theme:
      css/dashboard.css: {}
  dependencies:
    - xedc_admin/global
    - xedc_admin_ui/dashboard

engagement:
  css:
    theme:
      css/engagement.css: {}
  dependencies:
    - xedc_admin/global
